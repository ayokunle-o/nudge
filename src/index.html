<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<title>Nudge</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow" id="today-label"></p>
      <h1>Nudge</h1>
    </div>
    <button class="icon-btn" id="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="banner" id="setup-banner" hidden>
    <p>Add your Gemini key once so Nudge can understand what you say.</p>
    <button class="text-btn" id="banner-settings">Add key</button>
  </div>

  <main id="list"></main>
</div>

<!-- Bottom capture bar -->
<nav class="dock">
  <button class="icon-btn ghost" id="type-btn" aria-label="Type instead">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
  </button>
  <button class="mic" id="mic-btn" aria-label="Tap to talk">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
  </button>
  <span class="dock-spacer"></span>
</nav>

<!-- Recording overlay -->
<section class="overlay" id="rec" hidden>
  <div class="rec-body">
    <p class="eyebrow" id="rec-state">Listening</p>
    <p class="rec-time" id="rec-time">0:00</p>
    <p class="rec-hint" id="rec-hint">Talk it through. Who, what, and when if it matters.</p>
    <button class="mic big recording only-live" id="rec-stop" aria-label="Finish">
      <span class="pulse"></span>
      <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
    </button>
    <button class="mic big only-paused" id="rec-resume" aria-label="Carry on recording">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
    </button>
    <p class="rec-label only-paused">Tap to carry on talking</p>
    <div class="rec-actions">
      <button class="text-btn" id="rec-cancel">Discard</button>
      <button class="primary only-paused" id="rec-finish">Finish &amp; sort</button>
    </div>
  </div>
</section>

<!-- Type sheet -->
<section class="sheet" id="type-sheet" hidden>
  <div class="sheet-card">
    <h2>Type it instead</h2>
    <textarea id="type-input" rows="5" placeholder="e.g. She has an interview tomorrow at 10, ask how it went. Also buy her favourite chin chin on Friday."></textarea>
    <div class="row-end">
      <button class="text-btn" data-close>Cancel</button>
      <button class="primary" id="type-send">Add</button>
    </div>
  </div>
</section>

<!-- Item actions sheet -->
<section class="sheet" id="item-sheet" hidden>
  <div class="sheet-card">
    <div id="item-history"></div>
    <textarea id="item-edit" rows="3"></textarea>
    <label class="field"><span>Start nudging on</span><input type="date" id="item-date" /></label>
    <label class="field"><span>Exact reminder (optional)</span><input type="datetime-local" id="item-at" /></label>
    <div class="row-split">
      <button class="text-btn danger" id="item-delete">Delete</button>
      <div class="row-end">
        <button class="text-btn" id="item-tomorrow">Tomorrow</button>
        <button class="primary" id="item-save">Save</button>
      </div>
    </div>
  </div>
</section>

<!-- Settings sheet -->
<section class="sheet" id="settings" hidden>
  <div class="sheet-card">
    <h2>Settings</h2>
    <label class="field"><span>Gemini API key</span><input type="password" id="set-key" autocomplete="off" placeholder="Paste key from aistudio.google.com" /></label>
    <div class="times">
      <label class="field"><span>Morning</span><input type="time" id="set-t0" /></label>
      <label class="field"><span>Afternoon</span><input type="time" id="set-t1" /></label>
      <label class="field"><span>Night</span><input type="time" id="set-t2" /></label>
    </div>
    <label class="field"><span>Model</span><input type="text" id="set-model" autocomplete="off" /></label>
    <div class="stack">
      <button class="secondary" id="set-exact">Allow on-time alerts</button>
      <button class="secondary" id="set-test">Send a test notification</button>
    </div>
    <div class="row-end">
      <button class="text-btn" data-close>Close</button>
      <button class="primary" id="set-save">Save</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" hidden><span id="toast-msg"></span><button class="text-btn" id="toast-action" hidden></button></div>

<script src="app.js"></script>
</body>
</html>
